[package]
name = "gh-proxy-manager"
version = "3.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage GitHub download acceleration for yay/makepkg, git clone and plain curl"
license = "MIT"
repository = "https://github.com/pingod/gh-proxy-manager"
readme = "README.md"
keywords = ["github", "proxy", "archlinux", "makepkg", "gtk4"]
categories = ["command-line-utilities", "gui"]

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[dependencies]
adw = { package = "libadwaita", version = "0.9", optional = true, features = ["gtk_v4_10", "v1_7"] }
async-channel = "2.5.0"
clap = { version = "4.6", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", optional = true }
jiff = "1.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
